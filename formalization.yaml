related_formalizations: []

status:
  scope: >-
    Formalized: Theorem A for every θ ∈ (0, 1/2 − 10⁻⁴] (BModel.theoremA_full,
    BModel.theoremA_ii_complete), Theorem A′ (BModel.theoremAprime), Corollary
    onezero (BModel.one_zero_system_exists) and Corollary 2.2
    (BModel.corollary_2_2_complete), with the whole proof: Sections 2–8 and
    Appendix A, the random construction with its measurability and probability
    budget, and the numerical certificates of Appendix B (kernel-checked).
    Not formalized: eq. (84), the short-interval prime number theorem for the
    rational primes, is an explicit hypothesis (BaseRange.Huxley84) of every
    main theorem; its derivation from Heath-Brown 1988 and the de la Vallée
    Poussin error term (§7.1 of the paper) is not formalized. The remarks that
    the system of one_zero_system_exists has prime exponent α = 1 and integer
    exponent β = 0 (so is a [1, 0]-system in the BDR sense) are standard and are
    not part of the Lean statement, which states the integer bound and the
    absence of a zero-free half-plane directly. Lean's Theorem21 states part (i)
    of Theorem A as |N(x) − x| ≤ C x^θ + 3 x^θ log* x + x^{η(θ)} with C depending on
    θ and the realisation (the paper's D_max(x) + h(x)Λ⁻⁸ are absorbed into C).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

