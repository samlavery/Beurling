# formalization.yaml v0.4.
version: "v0.4"

project:
  name: "Discrete Beurling number systems with integer error below every power, without a zero-free half-plane (assuming the short-interval prime number theorem (84))"
  description: >-
    A Lean 4 / Mathlib formalization of S. Lavery, "Discrete Beurling number
    systems with integer error O(x^θ), θ < 1/2, whose zeta function has no
    zero-free half-plane". The headline theorem, BModel.one_zero_system_exists,
    constructs a discrete Beurling generalized number system whose integer
    counting function satisfies N(x) = x + O_ε(x^ε) for every ε > 0, while its
    zeta function is zero-free on no half-plane Re s > 1 − ε (a discrete
    [1, 0]-system in the sense of Broucke–Debruyne–Révész). The second theorem,
    BModel.corollary_2_2_complete, is Corollary 2.2: the answer to Question Q
    (must N(x) = Ax + O(x^θ) with θ < 1/2 force a zero-free half-plane?) is
    negative. The project also proves Theorem A for every θ ∈ (0, 1/2 − 10⁻⁴]:
    a system with N(x) = x + O(x^θ log* x) whose zeta function has zeros ρ_k with
    1 − Re ρ_k = (log log x_k + O(1))/log x_k, i.e. at distance 1·log log x_k / log x_k
    from the line Re s = 1. The method is integer-first: a randomised greedy
    rule chooses each generalized prime so that the integer count tracks a
    target x + R(x) whose oscillation R plants the zeros; the main work is a
    positive drift for the queue of composites at every scale, using a
    Beurling–Saias-type resolvent bound, a local prime number theorem for the
    realised system and a cluster-counting theorem, with numerical
    certificates checked by the Lean kernel (decide +kernel). In Lean both
    theorems are conditional on one explicit hypothesis, BaseRange.Huxley84,
    eq. (84) of the paper: a short-interval prime number theorem for the
    rational primes (relative error ≤ (log q)⁻³ on every interval of length
    ≥ (2q)^{7/12} in [q, 2q], for large q). This is a known theorem
    (Heath-Brown 1988 with the de la Vallée Poussin error term) that is not in
    Mathlib; it is a hypothesis of the theorems, not an axiom. The paper and
    the formalization were produced with heavy AI assistance (Claude agents;
    the Lean development was started by Aristotle, Harmonic) and have had no
    human expert review.
  authors:
    - "Samuel Lavery"
  license: "MIT"
  responsible_maintainers:
    - "Samuel Lavery"

