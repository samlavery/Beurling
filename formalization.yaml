      framework: "n/a"
      tool_setup: "Samuel Lavery chose the problem and the statements to formalize, wrote the instructions given to the agents (see PAPER-SPEC.md and review/*BRIEF.md), and decided which reported defects to fix. No claim is made that the proof text or the Lean code was written by hand."
      cost:
        wall_time: "not tracked"
        spend_usd: "n/a"
        hardware: "local machine"
      prompting_notes: "n/a"
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Claude Agent SDK), many parallel agents"
      tool_setup: "AI-assisted throughout. Claude agents wrote most of the paper's proof text and most of the Lean code (Aristotle's development assumed one hypothesis, Theorem21InputsS, covering about 90 of the 128 proof pages; the agents formalized it between 2026-10-26 and 2026-11-01), ran the Lean builds, wrote and ran the certificate scripts, and acted as component, end-to-end and adversarial referees (reports in review/). 170 of the 176 commits before packaging are co-authored by Claude Opus 5.5."
      cost:
        wall_time: "about 10 days (git history 2026-10-22 to 2026-11-01)"
        spend_usd: "not tracked"
        hardware: "local machine (Apple silicon) plus API"
      prompting_notes: "Agents were given briefs per section, lemma or Lean module, with instructions to report every defect found; the paper's CORRECTIONS-vs-v3.md records each deviation and its check."
    - method: "autonomous"
      models: ["Aristotle"]
      framework: "Aristotle (Harmonic)"
      tool_setup: "Aristotle started the Lean development (archive 75307cfd, 2026-10-26): it proved the main theorem from one large hypothesis, Theorem21InputsS, which the Claude agents then discharged. See ARISTOTLE_README.md and ARISTOTLE_SUMMARY.md."
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    The mathematics and the Lean code were produced by AI agents under the
    direction of the author. Aristotle (Harmonic) produced the first Lean
    development; Claude agents completed it and found and fixed defects in the
    paper and in Aristotle's model (listed in LEAN-FORMALIZATION.md and
    CORRECTIONS-vs-v3.md). The statement surface Challenge.lean was written and
    checked against the development by a Claude agent (definitions copied
    verbatim; #print axioms of both theorems gives only propext, Quot.sound and
    Classical.choice). lake comparator is run by Palomar's CI; it was not run
    locally (it needs a Linux sandbox).

fidelity:
  divergences: >-
    (1) Eq. (84) is a hypothesis (BaseRange.Huxley84) rather than proved. (2)
    Lean's form of Theorem A part (i) absorbs the paper's D_max(x) + h(x)Λ⁻⁸
    (both x^{o(1)}) into the constant C, which depends on θ and the
    realisation. (3) Two proof routes in the formalization of Theorem A′ differ
    from §8 of the paper (late noise via a per-k lag exponent; one modulus
    density for o_R); see FOLLOWUP-S2.md and LEAN-FORMALIZATION.md. (4) X_Hux is
    defined without the paper's "1 +" (correction 105). Other differences found
    during formalization were corrected in the paper (corrections 102–110, 117,
    118 in CORRECTIONS-vs-v3.md).

review:
  status: "self-assessed by AI agents only; no human expert review"
  reviewers:
    - "none"
  notes: >-
    Pre-submission review consisted only of AI checks: Claude agents compared
    the Lean statements and definitions with the paper (Challenge.lean was
    copied verbatim from the development), and
    AI component, end-to-end and adversarial referees checked the paper
    (review/). The Lean kernel checks the proofs and the numerical
    certificates. No human mathematician has reviewed the paper, the
    formalization or the correspondence between them.

alignment:
  namespace: "BModel"
  statements:
    - source: "Theorem A′ / Corollary onezero (thm:Aprime, cor:onezero)"
      lean: "BModel.one_zero_system_exists"
      module: "RequestProject.Beurling.OneZero.TheoremAprime"
      status: "proved (from eq. (84))"
      note: "States N(x) = x + O_ε(x^ε) for every ε > 0 and no zero-free half-plane; the explicit bound exp(120ℓ⁴/log ℓ) and the zero locations are in BModel.theoremAprime."
    - source: "Theorem A′ (thm:Aprime), full form"
      lean: "BModel.theoremAprime"
      module: "RequestProject.Beurling.OneZero.TheoremAprime"
      status: "proved (from eq. (84))"
      note: "On an event of probability ≥ 1 − 1.5/log X₀; see LEAN-FORMALIZATION.md."
    - source: "Corollary 2.2 (cor:notQ)"
      lean: "BModel.corollary_2_2_complete"
      module: "RequestProject.Beurling.Model.MarginComplete"
      status: "proved (from eq. (84))"
      note: "¬ QuestionQ, with QuestionQ as Definition 1.1."
    - source: "Theorem A (thm:A), parts (i) and (ii)"
      lean: "BModel.theoremA_full"
      module: "RequestProject.Beurling.Model.MarginComplete"
      status: "adapted (from eq. (84))"
      note: "For every θ ∈ (0, 1/2 − 10⁻⁴] with one threshold X_Hux; part (i) absorbs D_max + hΛ⁻⁸ into C (see fidelity)."
    - source: "Theorem A (thm:A), zero locations at 1·log log x_k"
      lean: "BModel.theoremA_ii_complete"
      module: "RequestProject.Beurling.Model.MarginComplete"
      status: "proved (from eq. (84))"
      note: "|(1 − Re ρ_k) log x_k − log log x_k| ≤ C and |log Im ρ_k − ((1−θ) log x_k − log log x_k)| ≤ C."

acknowledgements: "Lean 4 and Mathlib; Aristotle (Harmonic), which started the Lean development; Claude (Anthropic) agents; python-flint / Arb for the certificate scripts."
